name: Compilar apps (Windows e Android)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['tools/**', '.github/workflows/vendor-codemirror.yml']

permissions:
  contents: write

jobs:
  windows:
    name: Windows (instalador .exe e .msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Instalar dependências
        run: npm install
      - name: Ícones do app (Lume)
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Compilar
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: NotasLocais-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar SDK e NDK (usa o SDK que já vem na máquina do GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}" > /dev/null
          ls "$ANDROID_HOME/ndk"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Instalar dependências
        run: npm install
      - name: Gerar projeto Android
        run: npx tauri android init --ci
      - name: Ícones do app
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Permissões (microfone e câmera)
        run: |
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          for P in RECORD_AUDIO CAMERA MODIFY_AUDIO_SETTINGS; do
            grep -q "android.permission.$P" "$M" || perl -0pi -e "s#(<manifest[^>]*>)#\$1\n    <uses-permission android:name=\"android.permission.$P\" />#" "$M"
          done
          grep -n "uses-permission" "$M"
      - name: Compilar APK otimizado
        run: npx tauri android build --apk --target aarch64 --target armv7
      - name: Assinar APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1)
          echo "APK: $IN"
          "$BT/zipalign" -p -f 4 "$IN" alinhado.apk
          "$BT/apksigner" sign --ks android-assinatura/notaslocais-teste.jks --ks-key-alias notaslocais --ks-pass pass:notaslocais-teste --key-pass pass:notaslocais-teste --out Lume-Android.apk alinhado.apk
          "$BT/apksigner" verify Lume-Android.apk && ls -la Lume-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NotasLocais-Android
          path: Lume-Android.apk
          if-no-files-found: error

  publicar:
    name: Publicar em Releases
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
      - name: Organizar arquivos
        run: |
          mkdir -p saida
          find arquivos -name "*.apk" | head -1 | xargs -I{} cp {} "saida/Lume-Android.apk"
          find arquivos -name "*-setup.exe" | head -1 | xargs -I{} cp {} "saida/Lume-Windows-instalador.exe"
          find arquivos -name "*.msi" | head -1 | xargs -I{} cp {} "saida/Lume-Windows.msi"
          ls -la saida
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lume (teste ${{ github.run_number }})
          body: |
            Versão de teste gerada automaticamente a partir do commit ${{ github.sha }}.
            - **Android:** baixe `Lume-Android.apk` no celular e abra (permita instalar de fontes desconhecidas).
            - **Windows:** baixe `Lume-Windows-instalador.exe` e execute (em "O Windows protegeu o computador", clique em Mais informações → Executar assim mesmo).
          prerelease: true
          make_latest: true
          files: saida/*
