name: Compilar apps (Windows e Android)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['tools/**', '.github/workflows/vendor-codemirror.yml']

permissions:
  contents: write

jobs:
  windows:
    name: Windows (instalador .exe e .msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Número da versão (0.1.N, sobe a cada compilação)
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json',j=JSON.parse(require('fs').readFileSync(f,'utf8'));j.version='0.1.${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(j,null,1))"
          grep '"version"' src-tauri/tauri.conf.json
      - name: Instalar dependências
        run: npm install
      - name: Ícones do app
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Compilar
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: NotasLocais-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar SDK e NDK (usa o SDK que já vem na máquina do GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}" > /dev/null
          ls "$ANDROID_HOME/ndk"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Número da versão (0.1.N, sobe a cada compilação)
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json',j=JSON.parse(require('fs').readFileSync(f,'utf8'));j.version='0.1.${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(j,null,1))"
          grep '"version"' src-tauri/tauri.conf.json
      - name: Instalar dependências
        run: npm install
      - name: Gerar projeto Android
        run: npx tauri android init --ci
      - name: Ícones do app
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Permissões (microfone, câmera e lembretes)
        run: |
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          for P in RECORD_AUDIO CAMERA MODIFY_AUDIO_SETTINGS POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE; do
            grep -q "android.permission.$P" "$M" || perl -0pi -e "s#(<manifest[^>]*>)#\$1\n    <uses-permission android:name=\"android.permission.$P\" />#" "$M"
          done
          grep -n "uses-permission" "$M"
      - name: Compilar APK otimizado
        run: npx tauri android build --apk --target aarch64 --target armv7
      - name: Assinar APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1)
          echo "APK: $IN"
          "$BT/zipalign" -p -f 4 "$IN" alinhado.apk
          "$BT/apksigner" sign --ks android-assinatura/notaslocais-teste.jks --ks-key-alias notaslocais --ks-pass pass:notaslocais-teste --key-pass pass:notaslocais-teste --out Marginalia-Android.apk alinhado.apk
          "$BT/apksigner" verify Marginalia-Android.apk && ls -la Marginalia-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NotasLocais-Android
          path: Marginalia-Android.apk
          if-no-files-found: error

  publicar:
    name: Publicar em Releases
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
      - name: Organizar arquivos
        run: |
          mkdir -p saida
          find arquivos -name "*.apk" | head -1 | xargs -I{} cp {} "saida/Marginalia-Android.apk"
          find arquivos -name "*-setup.exe" | head -1 | xargs -I{} cp {} "saida/Marginalia-Windows-instalador.exe"
          find arquivos -name "*.msi" | head -1 | xargs -I{} cp {} "saida/Marginalia-Windows.msi"
          ls -la saida
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Marginália Notes 0.1.${{ github.run_number }}
          body: |
            Versão 0.1.${{ github.run_number }} (commit ${{ github.sha }}).
            - **Android:** `Marginalia-Android.apk` — no Obtainium, use o endereço do repositório para receber as atualizações sozinho.
            - **Windows:** `Marginalia-Windows-instalador.exe` — depois de instalado, o próprio app avisa e instala as versões novas (Configurações → Atualizações).
            Links fixos (sempre a versão mais nova):
            - https://github.com/${{ github.repository }}/releases/latest/download/Marginalia-Android.apk
            - https://github.com/${{ github.repository }}/releases/latest/download/Marginalia-Windows-instalador.exe
          prerelease: false
          make_latest: true
          files: saida/*
      - name: Apagar versões antigas (fica só a mais nova)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP=v0.1.${{ github.run_number }}
          gh release list --repo ${{ github.repository }} --limit 200 --json tagName -q '.[].tagName' | while read -r T; do
            if [ "$T" != "$KEEP" ]; then echo "apagando $T"; gh release delete "$T" --repo ${{ github.repository }} --cleanup-tag -y || true; fi
          done
