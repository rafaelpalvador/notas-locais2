  else if(g==='IMG'||g==='EN-MEDIA'){s+=imgRef(c)}else if(g==='EN-TODO'){s+=(c.getAttribute('checked')==='true'?'[x] ':'[ ] ')+il(c)}

 const imgRef=c=>{if(ctx.media){const r=ctx.media(c);if(r!=null)return r}const src=c.getAttribute('src')||'',alt=(c.getAttribute('alt')||'').replace(/[\[\]|]/g,'');
  if(/^data:image\//.test(src)){const ext=(src.match(/^data:image\/(\w+)/)||[])[1]||'png',name='img-'+Date.now().toString(36)+'-'+imgs.length+'.'+ext.replace('jpeg','jpg').replace('svg+xml','svg');imgs.push({name,data:src});return'!['+alt+'](assets/'+name+')'}

 const P=t=>{t=t.replace(/[ \t]+\n/g,'\n').replace(/^\s+|\s+$/g,'');if(/^\[( |x)\]\s/.test(t)){if(out.length&&out[out.length-1]===''&&/^- \[( |x)\]/.test(out[out.length-2]||''))out.pop();out.push('- '+t,'');return}if(t)out.push(t,'')};
 const list=(el,d)=>{let k=1;el.childNodes.forEach(li=>{if(li.nodeType!==1||li.tagName!=='LI')return;const sub=[];let txt='';li.childNodes.forEach(c=>{if(c.nodeType===1&&(c.tagName==='UL'||c.tagName==='OL'))sub.push(c);else if(c.nodeType===1&&/^(P|DIV)$/.test(c.tagName))txt+=il(c)+' ';else if(c.nodeType===1)txt+=il({childNodes:[c]});else if(c.nodeType===3)txt+=c.textContent.replace(/\s+/g,' ')});

  out.push('| '+rows[0].join(' | ')+' |','|'+Array(n).fill('---').join('|')+'|',...rows.slice(1).map(r=>'| '+r.join(' | ')+' |'),'')};
 const walk=el=>el.childNodes.forEach(c=>{if(c.nodeType===3){const t=c.textContent.trim();if(t)P(t);return}if(c.nodeType!==1)return;const g=c.tagName;
  if(/^H[1-6]$/.test(g)){const l=Math.min(3,+g[1]);const t=il(c).trim();if(t)out.push('#'.repeat(l)+' '+t,'')}
